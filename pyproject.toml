[project]
name = "superlig-forecast"
version = "0.1.0"
description = "Point-in-time Süper Lig match and championship forecasting engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "duckdb>=1.5,<1.6",
  "httpx>=0.28,<0.29",
  "lightgbm>=4.7,<5",
  "matplotlib>=3.11,<4",
  "numpy>=2.5,<3",
  "orjson>=3.11,<4",
  "polars>=1.43,<2",
  "pyarrow>=25,<26",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.9,<2",
  "scipy>=1.18,<2",
  "tenacity>=9.1,<10",
  "truststore>=0.10.4",
  "typer>=0.27,<0.28",
  "tzdata>=2026.3",
]

[project.scripts]
superlig = "superlig_forecast.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.160,<7",
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.15,<0.16",
  "types-pyyaml>=6.0.12.20260518,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superlig_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
