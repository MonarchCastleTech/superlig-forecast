name: Deploy forecast dashboard to Pages

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Update forecast data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build static Pages artifact
        working-directory: dashboard
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub Pages activation can exceed the action's 10-minute default
          # during service-side queues. Keep the validated artifact waiting
          # instead of requiring a manual fresh run.
          timeout: 1200000
