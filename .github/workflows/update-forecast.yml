name: Update forecast data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: forecast-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Restore bounded source cache
        uses: actions/cache@v6
        with:
          path: |
            data/raw/_http_cache
            data/raw/_manifests
            data/raw/transfermarkt-squad-*
          key: forecast-sources-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            forecast-sources-${{ runner.os }}-

      - name: Install Python environment
        run: uv sync --locked

      - name: Fetch all official TFF match weeks
        shell: bash
        run: |
          set -euo pipefail
          tff_page="$(uv run superlig fetch-data \
            --source tff-season \
            --season 2026-27 \
            --tff-base-url https://www.tff.org \
            --output data/raw)"
          test -f "$tff_page"
          echo "TFF_PAGE=$tff_page" >> "$GITHUB_ENV"

      - name: Rebuild five-million-play forecast
        run: |
          uv run superlig forecast-season \
            --season 2026 \
            --simulations 5000000 \
            --seed 202627 \
            --model-artifact automation/seeds/model-2026-27.json \
            --tff-page "$TFF_PAGE" \
            --value-coefficient 0 \
            --output "$RUNNER_TEMP/forecast"
          uv run superlig export-dashboard-data \
            --forecast "$RUNNER_TEMP/forecast" \
            --backtest automation/seeds/backtest-20-seasons.json \
            --position-backtest automation/seeds/backtest-positions-20-seasons.json \
            --output "$RUNNER_TEMP/dashboard-candidate.json"

      - name: Reconcile and atomically publish candidate
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          uv run superlig refresh-dashboard \
            --season 2026 \
            --simulations 5000000 \
            --candidate "$RUNNER_TEMP/dashboard-candidate.json" \
            --tff-page "$TFF_PAGE" \
            --output dashboard/public/data/dashboard.json

      - name: Run Python quality gates
        run: |
          uv run pytest -q
          uv run mypy src
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run dashboard quality gates
        working-directory: dashboard
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm audit --omit=dev

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          approved=(
            dashboard/public/data/dashboard.json
            dashboard/public/data/current-changes.json
            automation/state/current-players.json
          )
          existing=()
          for path in "${approved[@]}"; do
            [[ -e "$path" ]] && existing+=("$path")
          done
          if (( ${#existing[@]} == 0 )) \
            || [[ -z "$(git status --porcelain -- "${existing[@]}")" ]]; then
            echo "Validated refresh produced no data change."
            exit 0
          fi
          git config user.name "superlig-forecast-bot"
          git config user.email "superlig-forecast-bot@users.noreply.github.com"
          git add -- "${existing[@]}"
          git commit -m "data: refresh Süper Lig forecast"
          git pull --rebase origin main
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Alert on autonomous refresh failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "[forecast-deadman] Autonomous refresh failed";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `The scheduled forecast refresh failed its source, freshness, model, or publication gate.\n\nRun: ${runUrl}\nCommit: \`${context.sha}\`\n\nThe previous dashboard remains online, but this run was not accepted as current.`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Resolve autonomous refresh alert
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "[forecast-deadman] Autonomous refresh failed";
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            for (const issue of open.filter((item) => !item.pull_request && item.title === title)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Recovered in ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}.`
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
            }
